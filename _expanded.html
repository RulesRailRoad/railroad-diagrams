<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BNGL Expander</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea { width: 100%; height: 60px; margin-bottom: 10px; }
    pre { background: #f0f0f0; padding: 10px; }
  </style>
</head>
<body>

  <h2>BNGL Expression Expander</h2>

  <label for="moltext">Molecule Types (BNGL Format):</label><br>
  <textarea id="moltext">A(a,b)
B(x~Y,z)</textarea><br>

  <label for="expr">Enter BNGL Expression:</label><br>
  <textarea id="expr">(A(a~U),B(b))</textarea><br>

  <button onclick="expand()">Expand</button>

  <h3>Result:</h3>
  <pre id="result"></pre>

  <script>
    function moleculeSiteDict(moleculeLines) {
      const molSiteDict = {};

      for (const line of moleculeLines) {
        const trimmed = line.trim();
        if (trimmed.startsWith("#") || !trimmed.includes("(")) continue;

        const match = trimmed.match(/^(\w+)\((.*?)\)/);
        if (!match) continue;

        const molecule = match[1];
        const sitesBlock = match[2];
    const sites = sitesBlock.split(',').map(s => s.trim()).filter(s => s.length > 0);
        molSiteDict[molecule] = sites;
      }

      return molSiteDict;
    }

    function expandExpr(bnglExpr, molSiteDict) {
      const chunks = bnglExpr.split('.');
      const expandedChunks = [];

      for (let chunk of chunks) {
        chunk = chunk.trim();

        if (chunk.includes('(') && chunk.includes(')')) {
          const molEndIdx = chunk.indexOf('(');
          const exprEndIdx = chunk.indexOf(')');
          const molName = chunk.slice(0, molEndIdx);
          const inside = chunk.slice(molEndIdx + 1, exprEndIdx);

          const givenSites = {};
          for (const s of inside.split(',')) {
            const trimmed = s.trim();
            const sBase = trimmed.split('~')[0].split('!')[0];
            givenSites[sBase] = trimmed;
          }

          const sites = molSiteDict[molName] || [];
          const allSites = [];

          for (let site of sites) {
            const base = site.split('~')[0].split('!')[0];
            if (givenSites.hasOwnProperty(base)) {
              let s = givenSites[base];
              if (!s.includes('!')) {
                s += '!-';
              }
              allSites.push(s);
            } else {
              site += '!?';
              allSites.push(site);
            }
          }

          expandedChunks.push(`${molName}(${allSites.join(',')})`);
        } else {
          expandedChunks.push(chunk);
        }
      }

      return expandedChunks.join('.');
    }

    function expand() {
      const expr = document.getElementById('expr').value;
      const molLines = document.getElementById('moltext').value.split('\n');
      const molSiteDict = moleculeSiteDict(molLines);

      const result = expandExpr(expr, molSiteDict);
      document.getElementById('result').textContent = result;
    }
  </script>

</body>
</html>
